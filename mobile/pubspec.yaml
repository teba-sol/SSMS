name: sscs_mobile
description: Student Status Checkup System - Mobile App for Teachers & Parents
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  supabase_flutter: ^2.8.4
  flutter_local_notifications: ^18.0.1
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  equatable: ^2.0.7
  dartz: ^0.10.1
  shimmer: ^3.0.0
  fl_chart: ^0.69.0
  table_calendar: ^3.1.3
  shared_preferences: ^2.3.3
  image_picker: ^1.1.2
  url_launcher: ^6.3.1
  flutter_animate: ^4.5.2
  lottie: ^3.1.3
  percent_indicator: ^4.2.4
  timeago: ^3.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
