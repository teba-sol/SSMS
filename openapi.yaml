      responses:
        '200':
          description: List of notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'

  /rest/v1/notifications?id=eq.{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    patch:
      tags: [Notifications]
      operationId: markNotificationAsRead
      summary: Mark notification as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                is_read:
                  type: boolean
                  example: true
      responses:
        '200':
