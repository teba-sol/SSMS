  # ═══════════════════════════════════════════════════════
  # MESSAGES
  # ═══════════════════════════════════════════════════════
  /rest/v1/conversations:
    get:
      tags: [Messages]
      operationId: listConversations
      summary: List user's conversations
      description: Returns conversations where the current user is a participant.
      responses:
        '200':
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationWithRelations'

    post:
      tags: [Messages]
      operationId: startConversation
      summary: Start a new conversation
      description: |
        Creates a new conversation or returns existing one between two users.
        Enforces participant ordering (lower UUID as participant1).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConversationCreate'
      responses:
        '200':
          description: Conversation created or found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'

  /rest/v1/messages:
    get:
      tags: [Messages]
      operationId: listMessages
      summary: Get messages for a conversation
      parameters:
        - name: conversation_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: Conversation ID
        - name: order
          in: query
          schema:
            type: string
            default: created_at.asc
        - name: limit
          in: query
          schema:
            type: integer
            default: 100
            maximum: 100
      responses:
        '200':
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'

    post:
      tags: [Messages]
      operationId: sendMessage
      summary: Send a message
      description: |
        Sends a message and updates the conversation's last_message_at timestamp.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversation_id, sender_id, content]
              properties:
                conversation_id:
                  type: string
                  format: uuid
                sender_id:
                  type: string
                  format: uuid
                content:
                  type: string
                  minLength: 1
      responses:
        '201':
          description: Message sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  # ═══════════════════════════════════════════════════════
  # NOTIFICATIONS
  # ═══════════════════════════════════════════════════════
  /rest/v1/notifications:
