  # ═══════════════════════════════════════════════════════
  # ATTENDANCE
  # ═══════════════════════════════════════════════════════
  /rest/v1/attendance:
    get:
      tags: [Attendance]
      operationId: listAttendance
      summary: List attendance records
      description: Returns paginated attendance with student and class data.
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: class_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by class (required for most queries)
        - name: date
          in: query
          schema:
            type: string
            format: date
          description: Filter by date
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/AttendanceStatus'
          description: Filter by status
        - name: student_id
          in: query
          schema:
            type: string
            format: uuid
          description: Filter by student
        - name: order
          in: query
          schema:
            type: string
            default: date.desc
      responses:
        '200':
          description: List of attendance records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceWithRelations'

  /rest/v1/attendance/rpc/upsert:
    post:
      tags: [Attendance]
      operationId: upsertAttendance
      summary: Bulk upsert attendance records
      description: |
        Bulk insert or update attendance records for a class on a specific date.
        Uses UPSERT with conflict resolution on (student_id, class_id, date).
        Teachers can only mark attendance for their assigned classes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceUpsert'
      responses:
        '200':
          description: Attendance records upserted
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'

