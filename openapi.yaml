  # ═══════════════════════════════════════════════════════
  /rest/v1/rpc/get_dashboard_stats:
    post:
      tags: [Dashboard]
      operationId: getDashboardStats
      summary: Get dashboard statistics
      description: |
        Returns aggregated stats for the dashboard:
        total students, teachers, classes, parents, enrollments,
        current academic year, recent announcements, today's attendance, recent activities.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardStats'

  # ═══════════════════════════════════════════════════════
  # RPC FUNCTIONS
  # ═══════════════════════════════════════════════════════
  /rest/v1/rpc/set_current_academic_year:
    post:
      tags: [Academic Years]
      operationId: setCurrentAcademicYear
      summary: Set current academic year
      description: |
        Changes which academic year is marked as current.
        Only one year can be current at a time.
        SECURITY DEFINER function — admin only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [year_id]
              properties:
                year_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean

  /rest/v1/rpc/get_user_role:
    post:
      tags: [Authentication]
      operationId: getUserRole
      summary: Get current user's role
      description: Returns the role of the authenticated user from the profiles table.
      requestBody:
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: User role
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserRole'

  # ═══════════════════════════════════════════════════════
  # EDGE FUNCTIONS
  # ═══════════════════════════════════════════════════════
  /functions/v1/create-user:
    post:
      tags: [Edge Functions]
      operationId: createUser
      summary: Create a new user account (Admin only)
      description: |
        Admin-only edge function to create teacher or parent accounts.
        Creates auth user, profile, and optionally a teacher record.
        Requires `Authorization: Bearer <admin-jwt>` and uses service role key internally.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '200':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /functions/v1/logout:
    post:
      tags: [Edge Functions]
      operationId: edgeLogout
      summary: Logout and deactivate device tokens
      description: |
        Deactivates all FCM device tokens for the user on logout.
        Requires valid JWT in Authorization header.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out successfully
